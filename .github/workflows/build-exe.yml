name: Build 0110 Ghostivator

on:
  push:
    branches: [main]
    paths:
      - '0110-Ghostivator.ps1'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install ps2exe
        shell: pwsh
        run: Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber

      - name: Build executable
        shell: pwsh
        run: |
          Import-Module ps2exe
          Invoke-PS2EXE -inputFile .\0110-Ghostivator.ps1 -outputFile .\0110-Ghostivator.exe -title "0110 Ghostivator" -description "Ghost Series motivational message generator" -company "Ghost Series" -product "0110 Ghostivator" -version "1.0.0.0"

      - name: Commit executable to repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 0110-Ghostivator.exe
          if (git diff --cached --quiet) {
            Write-Host "Executable is already up to date."
          } else {
            git commit -m "Build 0110 Ghostivator executable"
            git push
          }
